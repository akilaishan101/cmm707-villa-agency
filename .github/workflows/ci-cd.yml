name: Build and Blue-Green Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: villa-agency-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: villa-agency-cluster
  KUBERNETES_NAMESPACE: villa-agency

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: villa-property-service
            context: services/property-service
          - image: villa-agent-service
            context: services/agent-service
          - image: villa-enquiry-service
            context: services/enquiry-service
          - image: villa-analytics-service
            context: services/analytics-service
          - image: villa-frontend
            context: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Blue-green deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy inactive environments and switch services
        env:
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x scripts/blue-green-deploy.sh

          scripts/blue-green-deploy.sh \
            villa-property-service villa-property-service \
            "$REGISTRY_USER/villa-property-service:$IMAGE_TAG" /health

          scripts/blue-green-deploy.sh \
            villa-agent-service villa-agent-service \
            "$REGISTRY_USER/villa-agent-service:$IMAGE_TAG" /health

          scripts/blue-green-deploy.sh \
            villa-enquiry-service villa-enquiry-service \
            "$REGISTRY_USER/villa-enquiry-service:$IMAGE_TAG" /health

          scripts/blue-green-deploy.sh \
            villa-analytics-service villa-analytics-service \
            "$REGISTRY_USER/villa-analytics-service:$IMAGE_TAG" /health

          scripts/blue-green-deploy.sh \
            villa-frontend villa-frontend-service \
            "$REGISTRY_USER/villa-frontend:$IMAGE_TAG" /

      - name: Verify the public endpoint
        if: ${{ vars.APP_BASE_URL != '' }}
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${APP_BASE_URL%/}/" > /dev/null

      - name: Deployment summary
        run: |
          kubectl get deployments,services \
            --namespace "$KUBERNETES_NAMESPACE" \
            --show-labels
