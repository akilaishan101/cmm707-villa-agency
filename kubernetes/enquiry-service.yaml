apiVersion: apps/v1
kind: Deployment
metadata:
  name: villa-enquiry-service
  namespace: villa-agency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: villa-enquiry-service
  template:
    metadata:
      labels:
        app: villa-enquiry-service
    spec:
      serviceAccountName: villa-enquiry-service-account
      containers:
        - name: enquiry-service
          image: docker.io/akila101/villa-enquiry-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: villa-database-secret
                  key: DATABASE_URL
            - name: NOTIFICATION_FUNCTION_NAME
              value: villa-agency-enquiry-notification
            - name: AWS_DEFAULT_REGION
              value: ap-south-1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: villa-enquiry-service
  namespace: villa-agency
spec:
  type: ClusterIP
  selector:
    app: villa-enquiry-service
  ports:
    - name: http
      port: 80
      targetPort: http
