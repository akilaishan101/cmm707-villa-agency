apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: villa-agency-deployer
  namespace: villa-agency
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - services/proxy
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: villa-agency-deployer
  namespace: villa-agency
subjects:
  - kind: Group
    name: villa-agency-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: villa-agency-deployer
  apiGroup: rbac.authorization.k8s.io
